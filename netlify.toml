[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# Static assets served from public/
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# Route all dynamic application paths to the serverless function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
