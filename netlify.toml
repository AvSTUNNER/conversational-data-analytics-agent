[build]
  functions = "netlify/functions"
  publish = "src/web/static"

[build.environment]
  PYTHON_VERSION = "3.12"

# Redirect all root & app requests to the Netlify serverless function
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
